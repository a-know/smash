name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Test & Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Lint Swift formatting
        run: >-
          xcrun swift format lint --recursive --strict
          MarkdownDriveMac
          Packages/MarkdownDriveCore

      - name: Test MarkdownDriveCore
        run: xcrun swift test --package-path Packages/MarkdownDriveCore

      - name: Build macOS application
        run: >-
          xcodebuild
          -project MarkdownDrive.xcodeproj
          -scheme MarkdownDriveMac
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath .build/XcodeDerivedData
          CODE_SIGNING_ALLOWED=NO
          build
