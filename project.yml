name: MarkdownDrive

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  xcodeVersion: "16.4"

packages:
  MarkdownDriveCore:
    path: Packages/MarkdownDriveCore

settings:
  base:
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  MarkdownDriveMac:
    type: application
    platform: macOS
    productName: Markdown Drive
    configFiles:
      Debug: Config/OAuth.xcconfig
      Release: Config/OAuth.xcconfig
    sources:
      - path: MarkdownDriveMac
    dependencies:
      - package: MarkdownDriveCore
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: U2LZVLHC3C
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/MarkdownDriveMac-Info.plist
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.a-know.MarkdownDrive

  MarkdownDriveMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarkdownDriveMacTests
    dependencies:
      - target: MarkdownDriveMac
      - package: MarkdownDriveCore
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.a-know.MarkdownDriveTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MarkdownDriveMac.app/Contents/MacOS/MarkdownDriveMac"

schemes:
  MarkdownDriveMac:
    build:
      targets:
        MarkdownDriveMac: all
        MarkdownDriveMacTests: [test]
    test:
      config: Debug
      targets:
        - MarkdownDriveMacTests
    run:
      config: Debug
    archive:
      config: Release
